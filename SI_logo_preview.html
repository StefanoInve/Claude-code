<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stefano Inversini — Logo Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #1a1a1a;
      color: #ccc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 64px;
    }

    h1 {
      font-size: 13px;
      letter-spacing: 6px;
      color: #666;
      text-transform: uppercase;
      font-weight: 400;
    }

    .versions {
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #555;
    }

    .logo-wrap {
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
    }

    .logo-wrap img {
      display: block;
      width: 320px;
      height: auto;
    }

    /* mock polo shirt context */
    .polo-section {
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .polo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .polo-shirt {
      width: 260px;
      height: 280px;
      border-radius: 12px 12px 4px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .polo-shirt.dark-shirt { background: #111; }
    .polo-shirt.white-shirt { background: #f5f5f5; }

    /* collar */
    .polo-shirt::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 36px;
      border-radius: 0 0 50% 50%;
      background: inherit;
      border: 2px solid rgba(255,255,255,0.08);
    }

    .polo-shirt img {
      width: 120px;
      height: auto;
      margin-top: 20px;
    }

    .polo-shirt.white-shirt::before {
      border-color: rgba(0,0,0,0.08);
    }

    footer {
      font-size: 10px;
      letter-spacing: 3px;
      color: #3a3a3a;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1>Stefano Inversini — Private Luxury Services &nbsp;·&nbsp; Logo Preview</h1>

  <!-- Full-size versions -->
  <div class="versions">
    <div class="card">
      <span class="label">Dark Version</span>
      <div class="logo-wrap">
        <img src="SI_logo_dark.svg" alt="SI Logo Dark"/>
      </div>
    </div>
    <div class="card">
      <span class="label">Light Version</span>
      <div class="logo-wrap">
        <img src="SI_logo_light.svg" alt="SI Logo Light"/>
      </div>
    </div>
  </div>

  <!-- Polo shirt mockup -->
  <div class="versions">
    <div class="polo">
      <span class="label">Polo scura</span>
      <div class="polo-shirt dark-shirt">
        <img src="SI_logo_dark.svg" alt="Logo su polo scura"/>
      </div>
    </div>
    <div class="polo">
      <span class="label">Polo bianca</span>
      <div class="polo-shirt white-shirt">
        <img src="SI_logo_light.svg" alt="Logo su polo bianca"/>
      </div>
    </div>
  </div>

  <footer>SI_logo_dark.svg &nbsp;·&nbsp; SI_logo_light.svg &nbsp;·&nbsp; viewBox 400×480</footer>

</body>
</html>
