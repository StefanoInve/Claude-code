<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Villa Crespi – Helicopter Tour Monte Rosa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1410;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
      font-family: Georgia, serif;
    }
    .outer-frame {
      border: 4px solid #c9a96e;
      padding: 6px;
      background: #c9a96e;
      box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.3);
    }
    .inner-frame {
      border: 2px solid #8b6914;
    }
  </style>
</head>
<body>
<div class="outer-frame">
  <div class="inner-frame">
  <svg width="920" height="680" viewBox="0 0 920 680" xmlns="http://www.w3.org/2000/svg">
    <defs>

      <!-- Paper texture gradient -->
      <radialGradient id="paperBg" cx="50%" cy="45%" r="70%">
        <stop offset="0%"   stop-color="#f5ede0"/>
        <stop offset="60%"  stop-color="#ede0cc"/>
        <stop offset="100%" stop-color="#d8c8a8"/>
      </radialGradient>

      <!-- Sky gradient (top area) -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#c8dff0" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#e8f0f8" stop-opacity="0"/>
      </linearGradient>

      <!-- Lake gradient -->
      <linearGradient id="lakeOrta" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#5b9fc4"/>
        <stop offset="50%"  stop-color="#4a8ab5"/>
        <stop offset="100%" stop-color="#3a7aa8"/>
      </linearGradient>
      <linearGradient id="lakeMag" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#5a9ec3"/>
        <stop offset="100%" stop-color="#3a78a5"/>
      </linearGradient>

      <!-- Snow gradient for Monte Rosa -->
      <linearGradient id="snowGrad" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%"   stop-color="#ffffff"/>
        <stop offset="40%"  stop-color="#eef2f5"/>
        <stop offset="100%" stop-color="#b8c8d8"/>
      </linearGradient>

      <!-- Rock gradient for Monte Rosa -->
      <linearGradient id="rockGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#9aaa b8"/>
        <stop offset="100%" stop-color="#6a7888"/>
      </linearGradient>

      <!-- Green valley gradient -->
      <linearGradient id="valleyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#9ab880"/>
        <stop offset="100%" stop-color="#7a9860"/>
      </linearGradient>

      <!-- Glow for route -->
      <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Drop shadow -->
      <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000055"/>
      </filter>

      <!-- Text shadow -->
      <filter id="textglow">
        <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f5ede0" flood-opacity="0.8"/>
      </filter>

      <!-- Helicopter clip -->
      <clipPath id="heliClip">
        <rect x="-40" y="-25" width="80" height="50"/>
      </clipPath>

    </defs>

    <!-- ═══════════════════════════════════════════════════
         SFONDO CARTA
    ═══════════════════════════════════════════════════ -->
    <rect width="920" height="680" fill="url(#paperBg)"/>

    <!-- Texture leggera a griglia vintage -->
    <g stroke="#c9a96e" stroke-width="0.4" opacity="0.18">
      <line x1="0"   y1="170" x2="920" y2="170"/>
      <line x1="0"   y1="340" x2="920" y2="340"/>
      <line x1="0"   y1="510" x2="920" y2="510"/>
      <line x1="230" y1="0"   x2="230" y2="680"/>
      <line x1="460" y1="0"   x2="460" y2="680"/>
      <line x1="690" y1="0"   x2="690" y2="680"/>
    </g>

    <!-- Sky wash sul terreno montano -->
    <rect width="920" height="320" fill="url(#skyGrad)"/>

    <!-- ═══════════════════════════════════════════════════
         TERRENO — VALLI E PIANURE
    ═══════════════════════════════════════════════════ -->

    <!-- Pianura padana (sud, base map) -->
    <path d="M 0,580 C 200,560 450,550 700,555 C 800,558 880,562 920,565 L 920,680 L 0,680 Z"
          fill="#c8d4a0" opacity="0.55"/>

    <!-- Zona collinare prealpina -->
    <path d="M 0,380 C 150,360 300,340 480,345 C 600,348 700,360 800,370 C 860,376 900,380 920,382
             L 920,580 C 880,572 840,565 800,565 C 700,565 600,555 480,550
             C 300,545 150,555 0,570 Z"
          fill="#b8cc98" opacity="0.5"/>

    <!-- Zone verdi di fondovalle (Val d'Ossola / Cusio) -->
    <path d="M 240,300 C 280,320 330,360 380,400 C 430,440 490,470 550,490 C 600,506 650,512 700,510
             L 700,560 C 650,562 600,558 550,542 C 490,522 430,492 380,452
             C 330,412 280,370 240,348 Z"
          fill="#a8c088" opacity="0.45"/>

    <!-- ═══════════════════════════════════════════════════
         CATENA ALPINA (SFONDO)
    ═══════════════════════════════════════════════════ -->

    <!-- Ridge di sfondo (Alpi) -->
    <path d="M 0,220 L 45,165 L 80,185 L 110,145 L 145,170 L 175,120 L 210,155 L 245,130 L 280,158
             L 320,140 L 360,165 L 395,148 L 430,170 L 470,152 L 510,175 L 560,160 L 600,178
             L 650,162 L 700,180 L 750,168 L 800,182 L 850,170 L 900,178 L 920,172
             L 920,260 L 0,260 Z"
          fill="#9aaa80" opacity="0.65"/>

    <!-- Ridge più vicino -->
    <path d="M 0,250 L 60,220 L 100,235 L 140,215 L 180,230 L 220,208 L 260,225 L 300,215
             L 340,230 L 390,218 L 440,235 L 490,222 L 540,238 L 590,225 L 640,240
             L 700,228 L 760,242 L 820,232 L 870,245 L 920,238
             L 920,300 L 0,300 Z"
          fill="#8a9a70" opacity="0.6"/>

    <!-- ═══════════════════════════════════════════════════
         MASSICCIO DEL MONTE ROSA
    ═══════════════════════════════════════════════════ -->

    <!-- Base rocciosa del massiccio -->
    <path d="M 50,330 C 80,300 100,280 120,265 L 145,245 L 168,222 L 188,245
             L 210,265 L 235,280 L 260,295 L 280,310 L 300,330 Z"
          fill="#8898a8" opacity="0.8"/>

    <!-- Versante principale (neve/ghiacciaio) -->
    <path d="M 100,310 L 120,275 L 135,255 L 148,238 L 165,218 L 175,228 L 185,248
             L 195,268 L 208,285 L 222,300 L 240,315 Z"
          fill="url(#snowGrad)"/>

    <!-- Cresta e picco principale — Punta Dufour -->
    <path d="M 130,295 L 145,255 L 155,232 L 165,218 L 172,230 L 178,252 L 185,272 L 192,290 Z"
          fill="#dce8f0"/>

    <!-- Cima (punta più alta) -->
    <path d="M 155,232 L 165,218 L 172,230 L 166,226 Z"
          fill="white"/>

    <!-- Neve laterale sinistra -->
    <path d="M 100,310 L 118,278 L 128,260 L 138,268 L 145,280 L 148,295 L 140,308 Z"
          fill="#e8f0f8" opacity="0.8"/>

    <!-- Neve laterale destra -->
    <path d="M 190,290 L 202,275 L 215,285 L 225,298 L 215,310 Z"
          fill="#e0eaf2" opacity="0.7"/>

    <!-- Ombre rocciose -->
    <path d="M 155,232 L 148,238 L 138,258 L 130,278 L 135,272 L 148,252 L 158,235 Z"
          fill="#8898b0" opacity="0.5"/>

    <!-- Ghiacciaio inferiore -->
    <path d="M 128,295 L 145,278 L 162,268 L 178,275 L 190,292 L 175,300 L 155,305 Z"
          fill="#d0dce8" opacity="0.85"/>

    <!-- Crepacci (linee sottili) -->
    <path d="M 140,285 C 148,280 158,278 168,282" stroke="#8898b0" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 148,296 C 155,292 163,291 170,295" stroke="#8898b0" stroke-width="0.8" fill="none" opacity="0.4"/>

    <!-- Contorno massiccio -->
    <path d="M 50,330 C 80,300 100,280 120,265 L 135,252 L 148,238 L 165,218 L 175,228
             L 185,248 L 200,270 L 215,285 L 235,300 L 260,315 L 280,328 L 300,335"
          stroke="#6a7888" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- ═══════════════════════════════════════════════════
         ALTRI RILIEVI
    ═══════════════════════════════════════════════════ -->

    <!-- Mottarone / colline tra i laghi -->
    <path d="M 540,295 L 558,265 L 572,278 L 585,258 L 600,272 L 615,262 L 628,278 L 642,270 L 655,285 L 665,300 Z"
          fill="#8a9a78" opacity="0.75"/>
    <path d="M 558,265 L 570,255 L 578,262 L 572,278 Z" fill="#a0b090" opacity="0.6"/>
    <path d="M 585,258 L 595,250 L 603,258 L 600,272 Z" fill="#a0b090" opacity="0.6"/>

    <!-- Colline a sud del lago -->
    <path d="M 580,350 L 592,335 L 600,342 L 610,330 L 622,340 L 630,350 Z"
          fill="#8a9a70" opacity="0.6"/>

    <!-- ═══════════════════════════════════════════════════
         LAGHI
    ═══════════════════════════════════════════════════ -->

    <!-- LAGO D'ORTA (elongato N–S, stretto) -->
    <path d="M 638,318
             C 631,332 626,350 623,370 C 620,390 620,412 623,432
             C 626,452 633,468 642,480 C 648,490 653,496 655,500
             C 658,494 662,487 665,476 C 670,463 672,448 671,430
             C 670,410 667,390 663,370 C 659,350 652,333 645,318 Z"
          fill="url(#lakeOrta)" stroke="#3a7aa8" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Riflesso sul lago d'Orta -->
    <path d="M 641,330 C 636,345 633,365 632,385 C 634,380 637,360 641,342 Z"
          fill="white" opacity="0.25"/>
    <path d="M 643,400 C 639,415 638,430 640,445" stroke="white" stroke-width="1.5" fill="none" opacity="0.2"/>

    <!-- Isola San Giulio -->
    <ellipse cx="652" cy="405" rx="7" ry="5" fill="#d4b890" stroke="#8b6914" stroke-width="0.8" opacity="0.9"/>
    <rect x="649" y="400" width="6" height="4" fill="#c8a870" opacity="0.7"/>

    <!-- LAGO MAGGIORE (parziale, lato est) -->
    <path d="M 790,295
             C 784,315 780,345 778,375 C 776,405 777,435 780,460
             C 783,485 788,508 793,525 C 797,510 800,488 801,462
             C 802,435 801,405 799,375 C 797,345 794,315 791,295 Z"
          fill="url(#lakeMag)" stroke="#3a7aa8" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Riflesso Lago Maggiore -->
    <path d="M 792,308 C 788,328 786,355 786,380 C 788,375 790,348 792,320 Z"
          fill="white" opacity="0.2"/>

    <!-- Lago di Mergozzo (piccolo) -->
    <ellipse cx="752" cy="320" rx="16" ry="24" fill="#5a9ec3" stroke="#3a7aa8" stroke-width="1" opacity="0.85" filter="url(#shadow)"/>
    <ellipse cx="748" cy="315" rx="5" ry="7" fill="white" opacity="0.15"/>

    <!-- ═══════════════════════════════════════════════════
         FIUMI
    ═══════════════════════════════════════════════════ -->

    <!-- Fiume Toce -->
    <path d="M 365,278 C 395,305 430,340 468,370 C 505,400 545,425 585,445
             C 625,460 670,468 710,468 C 738,468 762,460 778,448"
          stroke="#5a9ec3" stroke-width="2" fill="none" opacity="0.55"/>

    <!-- Nigoglia (emissario Lago d'Orta) -->
    <path d="M 656,482 C 668,490 688,498 710,502 C 730,506 752,504 770,498"
          stroke="#5a9ec3" stroke-width="1.5" fill="none" opacity="0.5"/>

    <!-- ═══════════════════════════════════════════════════
         PERCORSO ELICOTTERO
    ═══════════════════════════════════════════════════ -->

    <!-- Glow esterno ANDATA -->
    <path d="M 648,432 C 590,390 500,335 408,295 C 338,265 255,238 195,228 L 165,220"
          stroke="#f0d080" stroke-width="8" fill="none" opacity="0.15" stroke-linecap="round"/>

    <!-- ANDATA: Villa Crespi → Monte Rosa (oro scuro) -->
    <path d="M 648,432 C 590,390 500,335 408,295 C 338,265 255,238 195,228 L 165,220"
          stroke="#c9a96e" stroke-width="2.8" fill="none"
          stroke-dasharray="14,9" stroke-linecap="round"
          filter="url(#routeGlow)"/>

    <!-- Frecce direzionali ANDATA -->
    <g transform="translate(405,295) rotate(-22)">
      <polygon points="0,-7 -5,5 5,5" fill="#c9a96e" opacity="0.9"/>
    </g>
    <g transform="translate(255,238) rotate(-18)">
      <polygon points="0,-7 -5,5 5,5" fill="#c9a96e" opacity="0.9"/>
    </g>

    <!-- Glow esterno RITORNO -->
    <path d="M 165,232 C 210,260 310,320 420,370 C 510,410 590,438 648,448"
          stroke="#8b5e14" stroke-width="6" fill="none" opacity="0.15" stroke-linecap="round"/>

    <!-- RITORNO: Monte Rosa → Villa Crespi (bronzo più scuro) -->
    <path d="M 165,232 C 210,260 310,320 420,370 C 510,410 590,438 648,448"
          stroke="#a07828" stroke-width="2.2" fill="none"
          stroke-dasharray="10,9" stroke-linecap="round" opacity="0.85"/>

    <!-- Frecce direzionali RITORNO -->
    <g transform="translate(418,370) rotate(162)">
      <polygon points="0,-6 -4,4 4,4" fill="#a07828" opacity="0.85"/>
    </g>
    <g transform="translate(590,438) rotate(162)">
      <polygon points="0,-6 -4,4 4,4" fill="#a07828" opacity="0.85"/>
    </g>

    <!-- ═══════════════════════════════════════════════════
         ELICOTTERO STILIZZATO
         (posizionato a metà percorso andata)
    ═══════════════════════════════════════════════════ -->
    <g transform="translate(318, 262) rotate(-18)" filter="url(#shadow)">

      <!-- Ombra dell'elicottero -->
      <g transform="translate(4,4)" opacity="0.25">
        <ellipse cx="0" cy="2" rx="22" ry="9" fill="#2c3e50"/>
      </g>

      <!-- FUSOLIERA principale -->
      <path d="M -20,2 C -20,-5 -12,-10 -2,-10 L 14,-8 C 20,-6 24,-2 22,2
               C 20,6 14,8 6,8 L -14,8 C -18,7 -20,5 -20,2 Z"
            fill="#1a2535" stroke="#c9a96e" stroke-width="1.2"/>

      <!-- CABINA / vetrata -->
      <path d="M -18,1 C -18,-5 -12,-9 -4,-9 L 6,-8 C 12,-6 14,-2 12,2
               C 10,5 6,7 0,7 L -12,7 C -17,6 -18,4 -18,1 Z"
            fill="#3a85c8" stroke="#1a2535" stroke-width="0.8" opacity="0.88"/>

      <!-- Riflesso vetrata -->
      <path d="M -15,-1 C -14,-6 -9,-8 -3,-8 L 3,-7 C -2,-7 -8,-5 -13,-2 Z"
            fill="white" opacity="0.35"/>

      <!-- BOOM di coda -->
      <path d="M 22,0 L 40,-4 L 46,-4" stroke="#1a2535" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Piano orizzontale di coda -->
      <path d="M 40,-4 L 46,-1 L 46,-7 Z" fill="#1a2535"/>
      <path d="M 40,-4 L 35,-1" stroke="#1a2535" stroke-width="2.5" stroke-linecap="round"/>

      <!-- PATTINI (skids) -->
      <line x1="-16" y1="8"  x2="12" y2="8"  stroke="#c9a96e" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="-10" y1="5"  x2="-10" y2="9" stroke="#1a2535" stroke-width="1.8"/>
      <line x1="6"   y1="5"  x2="6"   y2="9" stroke="#1a2535" stroke-width="1.8"/>

      <!-- ROTORE PRINCIPALE (pale) -->
      <g transform="translate(0,-13)">
        <!-- Hub -->
        <circle r="3.5" fill="#8b6914" stroke="#c9a96e" stroke-width="1"/>
        <!-- Pala 1 -->
        <path d="M 0,0 C 10,-2 24,-3 28,-2 C 24,-1 10,0 0,0 Z"
              fill="#c9a96e" transform="rotate(0)"/>
        <!-- Pala 2 -->
        <path d="M 0,0 C 10,-2 24,-3 28,-2 C 24,-1 10,0 0,0 Z"
              fill="#c9a96e" transform="rotate(120)"/>
        <!-- Pala 3 -->
        <path d="M 0,0 C 10,-2 24,-3 28,-2 C 24,-1 10,0 0,0 Z"
              fill="#c9a96e" transform="rotate(240)"/>
      </g>

      <!-- ROTORE DI CODA -->
      <g transform="translate(44,-4)">
        <circle r="2" fill="#8b6914" stroke="#c9a96e" stroke-width="0.8"/>
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#c9a96e" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#c9a96e" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Logo VC (Villa Crespi) sulla fusoliera -->
      <text x="4" y="4" text-anchor="middle" font-size="6" fill="#c9a96e"
            font-family="Georgia, serif" font-weight="700" opacity="0.9">VC</text>

    </g>

    <!-- ═══════════════════════════════════════════════════
         MARKER MONTE ROSA
    ═══════════════════════════════════════════════════ -->
    <g transform="translate(165, 218)" filter="url(#shadow)">
      <!-- Cerchio esterno pulsante -->
      <circle r="16" fill="#c9a96e" opacity="0.2">
        <animate attributeName="r" values="16;24;16" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- Marker montagna -->
      <polygon points="0,-18 -13,2 13,2" fill="#6a8898" stroke="#3a5868" stroke-width="1.5"/>
      <polygon points="0,-18 -5,-6 5,-6" fill="white" opacity="0.9"/>
      <circle r="4" fill="#c9a96e" stroke="#8b6914" stroke-width="1.5"/>
      <circle r="1.5" fill="white"/>
    </g>

    <!-- ═══════════════════════════════════════════════════
         MARKER VILLA CRESPI
    ═══════════════════════════════════════════════════ -->
    <g transform="translate(648, 432)" filter="url(#shadow)">
      <!-- Cerchio pulsante esterno -->
      <circle r="18" fill="#c9a96e" opacity="0.25">
        <animate attributeName="r" values="18;30;18" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0;0.25" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Sfondo marker -->
      <circle r="13" fill="#c9a96e" stroke="#8b6914" stroke-width="2"/>
      <!-- Icona villa (edificio stilizzato) -->
      <rect x="-7" y="-2" width="14" height="10" fill="#8b4513" rx="1"/>
      <polygon points="-8,-2 0,-10 8,-2" fill="#a0522d"/>
      <!-- Tetto -->
      <rect x="-2" y="2" width="4" height="5" fill="#f5deb3"/>
      <!-- Finestre -->
      <rect x="-6" y="1" width="3" height="3" fill="#f5deb3" opacity="0.8"/>
      <rect x="3"  y="1" width="3" height="3" fill="#f5deb3" opacity="0.8"/>
    </g>

    <!-- ═══════════════════════════════════════════════════
         ETICHETTE GEOGRAFICHE
    ═══════════════════════════════════════════════════ -->

    <!-- MONTE ROSA label -->
    <g transform="translate(165, 193)">
      <rect x="-55" y="-17" width="110" height="32" rx="3"
            fill="#f0e6d3" fill-opacity="0.92" stroke="#c9a96e" stroke-width="0.8"/>
      <text text-anchor="middle" y="-3" font-size="12" font-weight="700" fill="#1a2535"
            font-family="Georgia, serif" letter-spacing="1.5">MONTE ROSA</text>
      <text text-anchor="middle" y="10" font-size="8.5" fill="#5a6a78" font-style="italic"
            font-family="Georgia, serif">4.634 m s.l.m.</text>
    </g>

    <!-- VILLA CRESPI label -->
    <g transform="translate(695, 428)">
      <rect x="-2" y="-22" width="148" height="44" rx="3"
            fill="#f0e6d3" fill-opacity="0.95" stroke="#c9a96e" stroke-width="1"/>
      <text x="8" y="-7" font-size="13" font-weight="700" fill="#8b4513"
            font-family="Georgia, serif" letter-spacing="1">VILLA CRESPI</text>
      <text x="8" y="9" font-size="9" fill="#5a4a3a" font-style="italic"
            font-family="Georgia, serif">Orta San Giulio</text>
      <text x="8" y="20" font-size="8" fill="#5a4a3a" font-style="italic"
            font-family="Georgia, serif">Lago d'Orta</text>
    </g>

    <!-- Isola San Giulio label -->
    <text x="662" y="408" font-size="7.5" fill="#3a5878" font-style="italic"
          font-family="Georgia, serif" opacity="0.8">I. S. Giulio</text>

    <!-- LAGO D'ORTA label (ruotato) -->
    <g transform="translate(636,393) rotate(-80)">
      <text text-anchor="middle" font-size="9" fill="#3a6a8a" font-style="italic"
            font-family="Georgia, serif" letter-spacing="0.8" opacity="0.85">Lago d'Orta</text>
    </g>

    <!-- LAGO MAGGIORE label -->
    <g transform="translate(793,400) rotate(-85)">
      <text text-anchor="middle" font-size="9" fill="#3a6a8a" font-style="italic"
            font-family="Georgia, serif" letter-spacing="0.5" opacity="0.8">Lago Maggiore</text>
    </g>

    <!-- Lago di Mergozzo -->
    <text x="730" y="323" font-size="7" fill="#3a6a8a" font-style="italic"
          font-family="Georgia, serif" opacity="0.75">L. Mergozzo</text>

    <!-- Domodossola -->
    <g transform="translate(362,272)">
      <circle r="3.5" fill="#8b6914" opacity="0.75"/>
      <text x="6" y="4" font-size="8.5" fill="#3a2a1a" font-family="Georgia, serif" opacity="0.85">Domodossola</text>
    </g>

    <!-- Verbania -->
    <g transform="translate(800,370)">
      <circle r="3" fill="#8b6914" opacity="0.7"/>
      <text x="6" y="4" font-size="8" fill="#3a2a1a" font-family="Georgia, serif" opacity="0.8">Verbania</text>
    </g>

    <!-- VAL D'OSSOLA label -->
    <g transform="translate(348, 340) rotate(-50)">
